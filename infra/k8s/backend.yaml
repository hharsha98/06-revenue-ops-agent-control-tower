apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenueops-backend
  namespace: revenueops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revenueops-backend
  template:
    metadata:
      labels:
        app: revenueops-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/revenueops-backend:latest
          ports:
            - containerPort: 8060
          envFrom:
            - secretRef:
                name: revenueops-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8060
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: revenueops-backend
  namespace: revenueops
spec:
  selector:
    app: revenueops-backend
  ports:
    - port: 8060
      targetPort: 8060


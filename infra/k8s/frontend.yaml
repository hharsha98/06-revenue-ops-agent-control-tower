apiVersion: apps/v1
kind: Deployment
metadata:
  name: revenueops-frontend
  namespace: revenueops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: revenueops-frontend
  template:
    metadata:
      labels:
        app: revenueops-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/revenueops-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: revenueops-frontend
  namespace: revenueops
spec:
  type: LoadBalancer
  selector:
    app: revenueops-frontend
  ports:
    - port: 80
      targetPort: 80

